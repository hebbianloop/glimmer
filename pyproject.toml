[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "glimmer-rokb"
version = "0.6.0.dev1"
description = "Research-object graph validation and provenance checks"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0"]
license = {text = "MIT"}

[project.optional-dependencies]
imaging = ["nibabel>=5"]
figures = ["numpy>=1.24", "matplotlib>=3.7", "networkx>=3"]

[project.scripts]
glimmer = "glimmer.tools.cli:main"

[tool.setuptools.packages.find]
include = ["glimmer*"]

[tool.setuptools.package-data]
glimmer = ["schema/*.yaml", "schema/*.md", "schema/glimmer-version", "schema/profiles/*.yaml", "schema/profiles/*.md"]
