# Glimmer Schema v0.6.0 — Front-Matter Field Definitions
#
# This file is the machine-readable contract for what fields each entity type
# must, may, and may not have in its sidecar front-matter. Validators consume
# this file directly; the human-readable spec is in `schema.md`.
#
# Format: YAML, intentionally simple. Each entity type is a top-level key.
# Under each type:
#   required:        — fields that MUST be present
#   optional:        — fields that MAY be present
#   edges-allowed:   — edge types whose target is permitted from this node type
#   body-required:   — whether the markdown body after the front-matter is required
#
# v0.3.1: made the core schema domain-NEUTRAL. Domain-specific fields (BIDS
# modality, fMRI design, Nipype node kind, neuroimaging output-kind) moved out of
# the core node types into DOMAIN PROFILES under profiles/ (curated) and a KB's
# _glimmer-profiles/ (local); a node resolves its profile via `domain` → KB
# `default-domain` → this file's `default-domain`. See profiles/_profile.schema.yaml.
# Also added the meta-graph social layer — `persona` (a person or role) and
# `organization` (institution/lab/funder/journal) node types, plus in-graph
# attribution edges `authored-by`, `affiliated-with`, `funded-by`, `mentors`,
# `leads`, `part-of`. The v0.3 `contributed-by` universal edge stays as the
# lightweight, out-of-graph attribution option; these edges are the strict,
# in-graph version whose targets must resolve to persona/organization nodes.
# v0.3: added `experiment` (task/acquisition paradigm), `concept` (research
# question / hypothesis as a first-class node), + `contributed-by` universal edge.
# v0.2 changes from v0.1: dropped `qc-artifact` and `rater` (over-indexed on QC
# as the canonical example). Added `finding` between `derivative` and `publication`
# per the EVI Evidence Graph Ontology. Agent identity is now a string field on
# `finding` and `derivative` (`produced-by-agent`), not a separate node type.
#
# v0.6.0: added the `run-record` node type — one concrete, replayable invocation
# (the PROV `Activity`) that binds a method + pinned, standard-validated inputs +
# expected outputs + the exact command + pinned environment + a runner-written
# verdict, advanced through a lifecycle (planned → ready → running → executed).
# This is the executable unit of the agentic loop (docs/agentic-loop.md), driven
# by `glimmer run` / `glimmer rerun` (glimmer/tools/run.py). With it: the core
# edges `reruns`, `consumes`, `regenerates`, `emits` (+ optional inverse
# `regenerated-by` on derivative); `tests-hypothesis` / `addresses-concept` are
# now allowed FROM a run-record. v0.6.0 also adds lightweight method-registry
# affordances — `registry-ref` plus the `implements` / `equivalent-to` / `refines`
# edges — so a method can point at a cross-project canonical pattern and the runner
# can certify equivalence by output-match. `standard` gains an optional `validator`
# hint so the runner's pre-run standards gate knows how to check conformance.

schema-version: "0.6.0"

# ─────────────────────────────────────────────────────────────────────────────
# domain profiles — this core schema defines only DOMAIN-NEUTRAL node types.
# Fields whose vocabulary is fixed by a domain standard (BIDS modalities, fMRI
# task designs, Nipype node kinds, …) do NOT live here; they live in PROFILE
# files that augment the core types:
#   glimmer/schema/profiles/<domain>.yaml   — the curated library (versioned in-repo)
#   <rokb>/_glimmer-profiles/<domain>.yaml  — a researcher's own, local to one KB
# A profile augments any node type with extra required/optional fields; see
# profiles/_profile.schema.yaml for the format. The validator selects a node's
# profile from its `domain` field, falling back to the KB-level `default-domain`
# in _glimmer-index.json, then to this core default below. See schema.md →
# "Domain profiles" for the full model and how to add one.
# ─────────────────────────────────────────────────────────────────────────────
default-domain: neuroimaging

# ─────────────────────────────────────────────────────────────────────────────
# common fields — every Glimmer node has these
# ─────────────────────────────────────────────────────────────────────────────
_common:
  required:
    id:                string                   # kebab-case, unique within dataset
    type:              <enum:{dataset,method,experiment,derivative,finding,standard,publication,concept,persona,organization,program,instrument,run-record}>
    name:              string                   # human-readable
    created:           datetime                 # ISO 8601, UTC preferred
    modified:          datetime                 # ISO 8601, UTC preferred
  optional:
    provenance-hash:   sha256                   # SHA-256 of body content; auto-computed
    description:       string                   # short free-text agent-readable summary
    edges:             edges-list               # outgoing edges; see edges-allowed per type
    domain:            string                   # profile selector; overrides the KB default-domain.
                                                 # names a profile in profiles/ or the KB's
                                                 # _glimmer-profiles/ (unknown domain → fields unchecked)

# ─────────────────────────────────────────────────────────────────────────────
# universal edges — allowed from ANY node type (validator unions these in)
# ─────────────────────────────────────────────────────────────────────────────
_universal-edges:
  - contributed-by     # → contributor id (ORCID URI / email / kebab); OUT-OF-GRAPH target.
                       #   role + identity carried as edge metadata, e.g.:
                       #   {type: contributed-by, target: "0000-0002-1825-0097", role: pi, name: "A VanMeter"}
  - in-program         # → program (this node is a member of a program/study); IN-GRAPH target.
                       #   e.g. {type: in-program, target: program-clad}
  - cross-project      # → a node in ANOTHER project's graph, by namespaced id; OUT-OF-GRAPH target.
                       #   carries inter-project claims + parent-canonical references across graphs, e.g.:
                       #   {type: cross-project, target: "ads-glimmer:concept-striatum-parcellation", role: inherited-from-parent}

# ─────────────────────────────────────────────────────────────────────────────
# dataset — research data of any kind. Domain-NEUTRAL: it carries only identity,
# generic provenance, and re-fetch coordinates. The attributes specific to a
# *kind* of data (participant/session/modality for neuroimaging, etc.) come from
# the domain profile the node resolves to — see "domain profiles" at the top of
# this file and profiles/neuroimaging.yaml for the worked example.
# ─────────────────────────────────────────────────────────────────────────────
dataset:
  inherits: _common
  optional:
    acquisition-date:  datetime                 # when the data was acquired/collected
    metrics:           map                      # tool-extracted QC/summary metrics
    # DataLad coordinates — domain-neutral re-fetch guarantees (git-annex backed)
    datalad-superdataset:  string               # URL of the superdataset
    datalad-relative-path: string               # path within the superdataset
    datalad-commit-sha:    string               # pinned commit of the containing sub-dataset
    datalad-annex-key:     string               # git-annex content hash, for single files
    # Data availability (v0.5.1) — "can I pull this, and from where?" Queryable provenance + liveness.
    data-remote:       [list-of-strings]         # git-annex special remote(s) / DataLad sibling(s) holding the bytes (e.g. hetzner-storagebox, box-neuroyouths, clad-master, ads-glimmer-annex)
    data-provenance:   string                   # where the bytes came from / how produced (acquisition, pipeline, recovery source)
    data-last-commit:  string                   # last commit (sha and/or date) touching this dataset's content
    data-liveness:     string                   # last reachability/liveness check, e.g. "2026-06-15: reachable" / "offline (needs VPN)" — lets a query decide whether it can be pulled
  edges-allowed:
    - produced-by      # → method (acquisition method)
    - derives-from     # → dataset (parent or source)
    - conforms-to      # → standard
    - cited-in         # → publication
    - acquired-with    # → instrument (device/measure the data was acquired with)
    - described-by     # → experiment (the paradigm this data realizes)
  body-required: false

# ─────────────────────────────────────────────────────────────────────────────
# method — a named analysis or pipeline (Nipype Workflow, Interface, Node)
# ─────────────────────────────────────────────────────────────────────────────
method:
  inherits: _common
  required:
    tool:              string                   # e.g., "fsl.BET", "nipype-workflow"
    version:           string                   # e.g., "fsl-6.0.5"
  optional:
    parameters:        map                      # invocation parameters
    parameters-hash:   sha256                   # hash over the parameter manifest
    container-image:   string                   # e.g., "nipreps/fmriprep:23.0.2"
    container-digest:  string                   # sha256 of the container image
    workflow-definition-sha: string             # git SHA of the workflow source file
    # v0.6 method-registry affordance: a method is a reusable f(x); its SEMANTIC
    # pattern can outlive one project's graph. `registry-ref` is a cross-project
    # namespaced id naming the canonical pattern this method implements (e.g.
    # "glimmer-methods:skullstrip-t1w"); the `implements` edge is the navigable
    # mirror. A dedicated `method-pattern` node type + published registry format
    # is deferred to v0.7 (federation).
    registry-ref:      string                   # namespaced canonical-pattern id, e.g. "glimmer-methods:skullstrip-t1w"
  edges-allowed:
    - applies-to         # → dataset
    - produces           # → derivative
    - validates-against  # → publication
    - requires-standard  # → standard
    - composes           # → method (sub-methods for workflows)
    - upstream-of        # → method (pipeline DAG: produces input for)
    - downstream-of      # → method (pipeline DAG: consumes output of)
    - implements         # → method/cross-project (the canonical pattern this realizes)
    - equivalent-to      # → method (same outputs within tolerance; runner-certified)
    - refines            # → method (a tuned / modified / fine-tuned variant of)
  body-required: true

# ─────────────────────────────────────────────────────────────────────────────
# derivative — output of applying a method to a dataset
# ─────────────────────────────────────────────────────────────────────────────
derivative:
  inherits: _common
  required:
    provenance-mode:   <enum:{deterministic,agent-inferred,stochastic}>
  optional:
    output-path:       string                   # relative path on disk
    output-format:     string                   # e.g., "nifti", "gifti", "csv"
    output-hash:       sha256                   # hash of the output file(s) — load-bearing for verification
    produced-by-agent: string                   # for agent-inferred outputs; the model id + version
    # DataLad coordinates
    datalad-relative-path: string
    datalad-commit-sha: string
    datalad-annex-key: string
  edges-allowed:
    - produced-by       # → method
    - derives-from      # → dataset or derivative
    - cited-in          # → publication
    - supports-finding  # → finding
    - regenerated-by    # → run-record (the replayable activity that produced this; optional inverse of `regenerates`)
  body-required: false

# ─────────────────────────────────────────────────────────────────────────────
# finding — interpreted assertion grounded in derivatives (between derivative
# and publication). EVI-aligned: a finding has interpretation text + evidence
# pointers + verifiable provenance. Multiple findings aggregate into a
# publication.
# ─────────────────────────────────────────────────────────────────────────────
finding:
  inherits: _common
  required:
    interpretation:    string                   # human-readable assertion ("subject's brain volume is X mm³")
    based-on:          [list-of-node-ids]       # derivative or dataset nodes supporting the claim
  optional:
    confidence:        <enum:{high,medium,low}> # or numeric/CI
    produced-by-agent: string                   # model id + version OR human persona name
    reasoning-trace:                            # REQUIRED when produced by an agent
      nodes-accessed:   [list-of-strings]
      metrics-cited:    map                     # {metric-name: rationale}
      evidence-summary: string
      model-identifier: string
      timestamp:        datetime
    challenged-by:     [list-of-node-ids]       # findings or publications that contradict
    supports:          [list-of-node-ids]       # findings or publications this reinforces
  edges-allowed:
    - based-on            # → derivative or dataset
    - addresses-concept   # → concept
    - cited-in            # → publication
    - challenged-by       # → finding or publication
    - supports            # → finding or publication
  body-required: false

# ─────────────────────────────────────────────────────────────────────────────
# experiment — a task / acquisition PARADIGM (the active experimental design)
# distinct from `standard` (a static spec): an experiment has conditions, a
# stimulus set, trials. Domain-specific design vocabulary (fMRI design types,
# modeled regressors, onset/duration timing) lives in the domain profile.
# ─────────────────────────────────────────────────────────────────────────────
experiment:
  inherits: _common
  optional:
    # task-name is the imaging/task-paradigm sense; OPTIONAL because the
    # research-program layer also uses `experiment` for hypothesis-level study
    # designs that have no single task file.
    task-name:         string                   # e.g., "emoFilm", "wof", "rest"
    conditions:        [list-of-strings]         # e.g., [REST, NEU, POS, NEG]
    duration-sec:      number
    n-trials:          int
  edges-allowed:
    - realized-by        # → dataset (the data acquired under this paradigm)
    - analyzed-by        # → method
    - tests-hypothesis   # → concept (the paradigm is designed to test this hypothesis)
    - conforms-to        # → standard
    - cited-in           # → publication
    - acquired-with      # → instrument (the device/software the paradigm is delivered/acquired with)
    - depends-on-method  # → method (research-program layer)
    - co-acquired-with   # → experiment/dataset (acquired in the same session)
  body-required: true

# ─────────────────────────────────────────────────────────────────────────────
# concept — a research question, hypothesis, or theme as a first-class node.
# The unit a research program operates at: what a grant funds, what a thesis
# defends, what a meta-analysis examines. Findings and publications point at it
# via `addresses-concept`; the agentic loop decomposes a question into sub-
# hypotheses via `decomposes-into`. See docs/agentic-loop.md.
# ─────────────────────────────────────────────────────────────────────────────
concept:
  inherits: _common
  required:
    statement:         string                   # the question / hypothesis / theme, as a sentence
  optional:
    concept-kind:      <enum:{research-question,hypothesis,theme,construct}>
    status:            <enum:{open,under-investigation,supported,refuted,superseded}>
    falsifiable:       bool                      # true when stated as a testable claim
    # scientometric / meta-graph fields (scout- and autoresearch-emitted concepts)
    outcome-data:      string                   # ref to a gated outcome variable, if any
    outcome-access:    string                   # access status of that outcome data
    sensitivity:       string                   # data-sensitivity classification
  edges-allowed:
    - decomposes-into      # → concept (a question decomposed into sub-hypotheses)
    - extends-concept      # → concept (specialization / theory inheritance)
    - subsumed-by          # → concept (becomes a special case of a broader concept)
    - competes-with        # → concept (rival hypothesis)
    - superseded-by        # → concept (a refined replacement supersedes this one)
    - supports             # → finding, publication, or concept (reinforcing evidence)
    - contradicts          # → finding, publication, or concept (contradictory evidence)
    - authored-by          # → persona (who framed this question / leads it)
    - funded-by            # → organization (the funder of this line of work)
    - tested-by-experiment # → experiment (a paradigm designed to test this concept)
    - cited-in             # → publication
  body-required: false                          # meta-graph concepts may be bodyless

# ─────────────────────────────────────────────────────────────────────────────
# standard — a spec, atlas, template, protocol
# ─────────────────────────────────────────────────────────────────────────────
standard:
  inherits: _common
  required:
    standard-class:    <enum:{spec,atlas,template,protocol,other}>
  optional:
    version:           string
    upstream-url:      string
    # v0.6: how the runner's pre-run standards GATE checks conformance to this
    # standard. The run-record only REFERENCES the standard (input-pin `conforms-to`
    # / `requires-standard`); the actual checking is delegated to the tool named
    # here, so the run-record never reimplements validation. `command` is a
    # template with `{path}` substituted for the input under test; a zero exit ==
    # conformant. `kind: glimmer` means "use `glimmer validate` on the graph".
    validator:         map                       # {tool: "bids-validator", command: "bids-validator {path}", kind: external|glimmer}
  edges-allowed:
    - defines           # → standard (sub-standards)
    - versions          # → standard (relates versions)
  body-required: true

# ─────────────────────────────────────────────────────────────────────────────
# publication — paper draft, abstract, preprint
# ─────────────────────────────────────────────────────────────────────────────
publication:
  inherits: _common
  required:
    pub-status:        <enum:{draft,submitted,accepted,published,abstract,preprint}>
  optional:
    venue:             string
    doi:               string
    year:              int
    title:             string
    authors:           [list-of-strings]
  edges-allowed:
    - cites-dataset
    - cites-method
    - cites-derivative
    - cites-finding
    - cites             # generic citation
    - aggregates        # → finding (this paper aggregates these findings)
    - addresses-concept # → concept (scout-emitted lit addressing a concept)
    - authored-by       # → persona
  body-required: false

# ─────────────────────────────────────────────────────────────────────────────
# research-program / scientometric layer — the `concept` type above plus the
# `persona` and `organization` types below are the people / organizations /
# hypotheses the autoresearch meta-graph emits, distinct from the imaging data
# layer. The value is in the edges that connect literature + hypotheses +
# contributors + funders.
# ─────────────────────────────────────────────────────────────────────────────

# ─────────────────────────────────────────────────────────────────────────────
# persona — a person (researcher, collaborator) or an organizational role.
# The in-graph identity a `contributed-by` / `authored-by` edge can resolve to.
# Use `persona` when you want to model the social graph (who mentors whom, who
# leads which question); use the lighter `contributed-by` universal edge with an
# out-of-graph ORCID/email target when you only need attribution, not a node.
# ─────────────────────────────────────────────────────────────────────────────
persona:
  inherits: _common
  required:
    persona-kind:      <enum:{researcher,collaborator,role,group}>
  optional:
    orcid:             string                   # ORCID id or URI, if a person
    email:             string
    aliases:           [list-of-strings]        # other names/handles this persona is known by
  edges-allowed:
    - affiliated-with   # → organization (current or historical affiliation)
    - mentors           # → persona (advising / supervision relationship)
    - leads             # → concept / organization / experiment (drives / heads this)
  body-required: true

# ─────────────────────────────────────────────────────────────────────────────
# organization — an institution, lab, consortium, journal, or funding body.
# Personas affiliate with it; concepts are funded by it; orgs nest via part-of.
# ─────────────────────────────────────────────────────────────────────────────
organization:
  inherits: _common
  required:
    org-kind:          <enum:{institution,lab,consortium,department,journal,funder,other}>
  optional:
    ror:               string                   # Research Organization Registry id
    upstream-url:      string
  edges-allowed:
    - part-of           # → organization (lab within a department within a university)
  body-required: true

# ─────────────────────────────────────────────────────────────────────────────
# instrument — a data-acquisition instrument: a scanner, a behavioral task/paradigm
# delivery system, a questionnaire/survey, an assay, or a device. The thing data is
# `acquired-with`. Domain-neutral core: a `dataset`/`experiment` points at it via the
# `acquired-with` edge; domain-specific instrument vocabulary (admin method, items,
# timing, …) and instrument→X edges (e.g. populates-schema) come from a domain profile.
# ─────────────────────────────────────────────────────────────────────────────
instrument:
  inherits: _common
  optional:
    instrument-kind:   <enum:{scanner,task,questionnaire,assay,device,software,other}>
    version:           string
    upstream-url:      string
  edges-allowed:
    - part-of           # → instrument (a sub-instrument / module of a battery)
    - conforms-to       # → standard
    - cited-in          # → publication
  body-required: true

# ─────────────────────────────────────────────────────────────────────────────
# program — a research study, cohort, or initiative as a first-class node: the
# CONTAINER that organizes datasets, experiments, concepts, and publications around
# one research mission. A program may nest inside a parent program via `part-of`
# (e.g. the CLAD subproject is part-of the ADS study). Any node declares membership
# with the universal `in-program` edge; relationships to nodes in ANOTHER program's
# graph use the universal `cross-project` edge (out-of-graph, namespaced target).
# Distinct from `organization` (the institution running it) and `concept` (a
# question it investigates).
# ─────────────────────────────────────────────────────────────────────────────
program:
  inherits: _common
  required:
    program-kind:      <enum:{study,cohort,subproject,initiative,consortium}>
  optional:
    status:            <enum:{active,completed,paused,archived}>
    start-date:        date
    end-date:          date
    outcome-measure:   string                   # the program's primary outcome(s), free text
  edges-allowed:
    - part-of             # → program (subproject nesting within a parent program, same graph)
    - led-by              # → persona (PI / study director)
    - funded-by           # → organization
    - includes-dataset    # → dataset
    - includes-experiment # → experiment
    - addresses-concept   # → concept
    - cited-in            # → publication
  body-required: true

# ─────────────────────────────────────────────────────────────────────────────
# run-record — ONE concrete, replayable invocation: the PROV `Activity` that
# realizes lineage. A `method` is a reusable tool; a `run-record` is *this* run of
# it — these exact pinned inputs, this command, this container digest, on this date,
# testing this hypothesis. It is the executable unit of the agentic loop: authored
# as part of a plan (`status: planned`, possibly with spec'd/unpinned inputs), then
# advanced through `ready → running → executed` by `glimmer run` (forward execution)
# or re-checked by `glimmer rerun` (reproduction). The runner writes `validation-gate`
# (the pre-run pinned+standard-valid check) and `replay-verdict` (the per-output
# verdict) back into the sidecar. See docs/proactive-provenance.md.
#
# input-pin  (each element of `inputs`):
#   {node: <dataset|derivative id>,            # the node consumed (mirror with a `consumes` edge)
#    datalad-annex-key: <key> | datalad-commit-sha: <sha>,   # the content pin; OMIT while status=planned (spec'd input)
#    conforms-to: <standard id>,               # optional: input must pass this standard's gate
#    role: <string>}                           # e.g. input-signal, mask
# output-pin (each element of `outputs`):
#   {node: <derivative id>,                    # MUST resolve to a derivative node (mirror with a `regenerates` edge)
#    expected-hash: "sha256:…",                # the recorded output-hash this run reproduces
#    output-path: <relative path>,
#    tier: byte-identical|numeric-tolerance|structural}   # optional per-output override of the mode default
# ─────────────────────────────────────────────────────────────────────────────
run-record:
  inherits: _common
  required:
    method:            string                   # node-id of the method this run executes (mirror with a `reruns` edge)
    command:           string                   # exact entrypoint / command line (datalad-run `cmd`)
    provenance-mode:   <enum:{deterministic,agent-inferred,stochastic}>  # selects the default verification tier
    status:            <enum:{planned,ready,running,executed,failed,superseded}>  # lifecycle
    inputs:            [list-of-input-pins]      # see header; pins required unless status=planned
    outputs:           [list-of-output-pins]     # see header; bind derivative node-ids + expected hash
  optional:
    container-image:   string                   # e.g., "python:3.11-slim"
    container-digest:  string                   # sha256 env pin; replayed via `datalad containers-run`
    workflow-definition-sha: string
    parameters:        map
    parameters-hash:   sha256
    reproduction-tolerance:  map                 # numeric tier: {default:{rel,abs}, quantities:{<name>:{rel,abs}}}
    run-at:            datetime
    runner:            string                    # datalad-run id / CI job / agent id
    produced-by-agent: string                    # set for agent-inferred / stochastic runs
    reasoning-trace:   map                        # REQUIRED when produced-by-agent is set (finding's shape)
    retriever-manifest: map                       # structural tier: index pin (reproducible-modulo-index)
    datalad-superdataset:  string
    datalad-relative-path: string
    datalad-commit-sha:    string
    datalad-annex-key:     string
    validation-gate:   map                        # WRITTEN BY THE RUNNER: per-input {pinned, standard, valid, validator}
    replay-verdict:    map                        # WRITTEN BY THE RUNNER: {verdict, tier, outputs-checked, numeric-checks, …}
  edges-allowed:
    - reruns             # → method (the method this run executes)
    - consumes           # → dataset or derivative (a pinned input)
    - regenerates        # → derivative (an output this run produces)
    - emits              # → finding (an interpretation this run produced)
    - tests-hypothesis   # → concept (the hypothesis this run tests — loop linkage)
    - addresses-concept  # → concept (the question this run addresses — loop linkage)
    - requires-standard  # → standard (inputs/outputs must conform; gated at runtime)
    - validates-against  # → publication (this run reproduces a published number)
  body-required: true

# ─────────────────────────────────────────────────────────────────────────────
# index file — required at the dataset root
# ─────────────────────────────────────────────────────────────────────────────
_glimmer-index:
  filename: "_glimmer-index.json"
  required:
    schema:            string                   # e.g., "glimmer/v0.3.1"
    dataset-name:      string
    node-count:        int
    nodes:             [list-of-nodes]
  optional:
    created:           datetime
    description:       string
    upstream-graph:    string
    default-domain:    string                   # domain profile for nodes that omit `domain`;
                                                 # overrides the core schema default. e.g. "neuroimaging"

# ─────────────────────────────────────────────────────────────────────────────
# validator hints
# ─────────────────────────────────────────────────────────────────────────────
_validator-hints:
  warn-if:
    - "dataset node has no `datalad-commit-sha`"
    - "derivative node has no `output-hash`"
    - "finding node has no `based-on` edge or empty list"
    - "method node has no `version` field"
    - "publication node has no `cites-*` edges"
    - "run-record output-pin has no `expected-hash` (status=executed)"
    - "run-record output/input/method node not mirrored by a regenerates/consumes/reruns edge"
    - "run-record status=executed but no `replay-verdict`"
  error-if:
    - "node `id` is not kebab-case"
    - "node `id` is not unique within the dataset"
    - "edge target does not exist in the index"
    - "edge type is not in the allowed list for the source node's type"
    - "required field is missing"
