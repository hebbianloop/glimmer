name: Verifier and packaged example
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verifier:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install '.[imaging]'
      - run: python -m unittest discover -s tests -v
      - name: Run installed CLI outside the source checkout
        run: |
          tmp=$(mktemp -d)
          cp -R examples/synthetic-provenance "$tmp/example"
          cd "$tmp"
          python example/smoke.py
